name: Validate dotfiles
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux shellcheck lua5.4 vim neovim python3-venv
          python3 -m venv /tmp/dotfiles-test-venv
          /tmp/dotfiles-test-venv/bin/pip install 'ansible-core==2.19.2'
      - name: Validate and exercise the installer in a temporary directory
        run: |
          export PATH="/tmp/dotfiles-test-venv/bin:$PATH"
          make test
