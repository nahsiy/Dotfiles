---
- name: Installer les dotfiles de l'utilisateur courant
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dotfiles_target_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    dotfiles_entries:
      - {src: ".zshrc", dest: ".zshrc"}
      - {src: ".tmux.conf", dest: ".tmux.conf"}
      - {src: ".vimrc", dest: ".vimrc"}
      - {src: ".wezterm.lua", dest: ".wezterm.lua"}
      - {src: "starship.toml", dest: ".config/starship.toml"}
    dotfiles_directories:
      - "{{ dotfiles_target_dir }}"
      - "{{ dotfiles_target_dir }}/.config"
      - "{{ dotfiles_target_dir }}/.config/nvim"
  tasks:
    - name: Vérifier la destination
      ansible.builtin.assert:
        that:
          - dotfiles_target_dir is string
          - dotfiles_target_dir.startswith('/')
          - dotfiles_target_dir != '/'
          - "'/../' not in dotfiles_target_dir"
          - "not dotfiles_target_dir.endswith('/..')"
        fail_msg: La destination doit être un chemin absolu explicite, hors racine.

    - name: Examiner les dossiers sans suivre les liens
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ dotfiles_directories }}"
      register: dotfiles_dir_stats

    - name: Refuser un dossier cible qui est un lien symbolique
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not item.stat.exists or (item.stat.isdir | default(false))
        fail_msg: "Destination non standard : {{ item.item }}. Adaptez manuellement votre installation."
      loop: "{{ dotfiles_dir_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Créer seulement les dossiers absents
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        mode: '0700'
      loop: "{{ dotfiles_dir_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Examiner les fichiers existants sans suivre les liens
      ansible.builtin.stat:
        path: "{{ dotfiles_target_dir }}/{{ item }}"
        follow: false
      loop: "{{ (dotfiles_entries | map(attribute='dest') | list) + ['.config/nvim/init.vim'] }}"
      register: dotfiles_file_stats

    - name: Préserver les fichiers déjà gérés par liens symboliques
      ansible.builtin.assert:
        that:
          - not (item.stat.islnk | default(false))
          - not item.stat.exists or (item.stat.isreg | default(false))
        fail_msg: "Fichier non standard : {{ item.item }}. Conservez votre gestionnaire de dotfiles existant."
      loop: "{{ dotfiles_file_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Copier les configurations avec sauvegarde
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ dotfiles_target_dir }}/{{ item.dest }}"
        mode: '0600'
        backup: true
        follow: false
      loop: "{{ dotfiles_entries }}"
      register: dotfiles_copies

    - name: Installer Neovim sans dépendance de plugin
      ansible.builtin.copy:
        src: ../init.vim
        dest: "{{ dotfiles_target_dir }}/.config/nvim/init.vim"
        mode: '0600'
        backup: true
        follow: false

    - name: Indiquer les sauvegardes créées
      ansible.builtin.debug:
        msg: "Sauvegarde : {{ item.backup_file }}"
      loop: "{{ dotfiles_copies.results }}"
      loop_control:
        label: "{{ item.item.dest }}"
      when: item.backup_file is defined
