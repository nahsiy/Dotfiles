# tmux >= 3.2. Le shell est celui de l'utilisateur.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "Configuration rechargée"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind a last-window
setw -g mode-keys vi
setw -g automatic-rename on
set -g set-clipboard on
# Thème intégré sans plugin obligatoire.
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#9ece6a] %Y-%m-%d %H:%M "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
setw -g window-status-format " #I:#W "
if-shell "command -v pbcopy >/dev/null 2>&1" "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy"
if-shell "test -r ~/.tmux.conf.local" "source-file ~/.tmux.conf.local"
